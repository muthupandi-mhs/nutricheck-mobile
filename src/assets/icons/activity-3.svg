<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    Activity level 3 of 5. Five bars bottom-aligned on a 24 grid, the
    first 3 filled.

    Everything is currentColor: the filled bars solid, the rest at 0.22 of
    the same. That is what lets a single "color" prop theme the whole glyph,
    and it is why the empty bars are not a second grey — a literal colour
    here would be a palette value frozen into an asset, and it would go
    stale the first time the palette moved.
  -->
  <rect x="1.5" y="15" width="3" height="7" rx="1.5" fill="currentColor" />
  <rect x="6" y="11.5" width="3" height="10.5" rx="1.5" fill="currentColor" />
  <rect x="10.5" y="8" width="3" height="14" rx="1.5" fill="currentColor" />
  <rect x="15" y="4.5" width="3" height="17.5" rx="1.5" fill="currentColor" opacity="0.22" />
  <rect x="19.5" y="1" width="3" height="21" rx="1.5" fill="currentColor" opacity="0.22" />
</svg>
